name: Render weather

on:
  schedule:
    - cron: "7 * * * *"      # hourly backup; GitHub runs these late or skips them often
  workflow_dispatch:          # the Kindle triggers this every 15 minutes (also the Run button)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the weather image
        run: |
          pip install --quiet pillow
          python render.py

      - name: Prepare site
        run: |
          mkdir site
          cp out/weather.png out/preview.png out/light.txt out/stamp.txt site/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Kindle weather</title>
          <body style="margin:0;background:#888"><img src="preview.png" style="max-width:100%;display:block;margin:auto">
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # If an earlier publish got stuck "in progress" on GitHub's side, every later
      # publish is refused. In that case cancel the stuck ones and try once more.
      - name: Clear stuck Pages deployments
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          for sha in $(gh api "repos/$repo/deployments?environment=github-pages&per_page=30" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            gh api -X POST "repos/$repo/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelled stuck deployment $sha" || true
          done
          # The stuck one can be this same commit (every Kindle-triggered run shares it).
          # Cancel it too, then wait until GitHub confirms before retrying.
          st="$(gh api "repos/$repo/pages/deployments/$GITHUB_SHA" --jq .status 2>/dev/null || true)"
          echo "this commit's last publish: ${st:-none}"
          case "$st" in
            *progress*|*queued*|*sync*|*updating*)
              gh api -X POST "repos/$repo/pages/deployments/$GITHUB_SHA/cancel" >/dev/null 2>&1 || true
              for i in $(seq 1 24); do
                st="$(gh api "repos/$repo/pages/deployments/$GITHUB_SHA" --jq .status 2>/dev/null || true)"
                case "$st" in *progress*|*queued*|*sync*|*updating*) sleep 5 ;; *) break ;; esac
              done
              echo "after cancel: $st"
              sleep 15 ;;
          esac

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled jobs in repos with no activity for 60 days.
      # Re-enabling the workflow each run keeps the schedule alive.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || true
